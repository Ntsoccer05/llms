# 環境変数（.env またはシェルで上書き可能）
# - APP_HOST_PORT / STREAMLIT_HOST_PORT: ホスト側のポート（デフォルト 8000 / 8501）
# - BACKEND_PORT / STREAMLIT_PORT: コンテナ内の待ち受けポート（デフォルト 8000 / 8501）
# - BACKEND_HOST: Streamlit がバックエンドに接続するときのホスト名（デフォルト backend）
# - NOTIFY_DIR: 通知 JSON の書き出し先（Streamlit コンテナ内パス、デフォルト /notify）
# - NOTIFY_BACKEND_URL: watcher がトーストから API を叩くときの URL（デフォルト http://localhost:8000）
# - APP_ENV: development で uvicorn --reload 有効
version: "3.8"
services:
  backend:
    container_name: fastapi-llm
    build:
      context: ./
      dockerfile: docker/Dockerfile
    ports:
      - "${APP_HOST_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ./app:/app
      - .:/workspace
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - REPO_PATH=${REPO_PATH:-/workspace}

  streamlit:
    container_name: streamlit-gui
    build:
      context: ./
      dockerfile: docker/Dockerfile
    ports:
      - "${STREAMLIT_HOST_PORT:-8501}:${STREAMLIT_PORT:-8501}"
    volumes:
      - ./app:/app
      - ./notify_data:/notify
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - BACKEND_HOST=${BACKEND_HOST:-backend}
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - NOTIFY_DIR=${NOTIFY_DIR:-/notify}
      - NOTIFY_BACKEND_URL=${NOTIFY_BACKEND_URL:-http://localhost:8000}
      - STREAMLIT_PORT=${STREAMLIT_PORT:-8501}
      - STREAMLIT_ADDRESS=${STREAMLIT_ADDRESS:-0.0.0.0}
    entrypoint: ["/bin/sh", "-c", "exec streamlit run streamlit_app.py --server.port=$${STREAMLIT_PORT:-8501} --server.address=$${STREAMLIT_ADDRESS:-0.0.0.0}"]
