[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llms-langgraph-agent"
version = "0.1.0"
description = "LangGraph Agent with Tavily Search and AWS SNS"
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.1.0",
    "langchain-tavily>=0.1.0",
    "langchain-aws>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "boto3>=1.26.0",
    "mcp>=0.1.0",
    "streamlit>=1.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
